; ESP-01S firmware for the GameConsole WiFi module.
;
; Builds a firmware image the console flashes from the SD card via
; Settings -> "Upgrade WiFi module". After `pio run`, copy the build output onto
; the SD card with `make -C Esp01s deploy` (or top-level `make deploy`). For how
; the console flashes it, see ../docu/flasher.md.

[env:esp01s]
platform = espressif8266
board = esp01_1m            ; ESP-01S = ESP8266EX with 1 MB flash
framework = arduino
monitor_speed = 923076      ; matches Serial.begin(NETWORK_UART_BAUD) in src/main.cpp

; Share the console<->ESP protocol contract with the console firmware so both
; sides build against one header.
build_flags = -I "${PROJECT_DIR}/../Shared/Esp01s"
