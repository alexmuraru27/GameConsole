# TestRenderer asset pack manifest.
#
# 64 GfxAsset (GFX1) sprites generated from gen_tiles.py (run it after editing;
# the .bin files are committed). The Makefile runs the packer over this manifest
# to produce TestRenderer.pak + TestRendererAssetEnum.h. Deliberately varied
# (32 opaque / 32 transparent, 8x8..64x32, 2bpp + 4bpp) to exercise the whole
# compositor and overflow the 8-slot decoded-tile cache. Text uses console fonts.
